<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar push content</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        a {
            text-decoration: none;
            color: #000;
        }

        li {
            list-style: none;
        }

        input {
            border: none;
            outline: none;
            background: none;
        }

        button {
            background-color: inherit;
            border: none;
            cursor: pointer;
        }

        body {
            width: 100vw;
            height: auto;
            font-family: "Poppins", sans-serif;
            position: relative;
        }

        .home-layout {
            display: flex;
            width: 100%;
            height: auto;
        }

        .home-layout .sidebar {
            z-index: 2;
            background-color: #18c29c;
            /* width: 80px; */
            max-width: 4rem;
            /* why max-width hear even though we have width ? */
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            /* width: 30%; */
        }

        .home-layout .sidebar .sidebar-container {
            padding: 1rem;
        }

        /* sidebar header */
        .home-layout .sidebar .sidebar-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.7rem;
        }

        .home-layout .sidebar .sidebar-logo .sidebar-toggler {
            transition: .2s ease-in-out;
        }

        .home-layout .sidebar .sidebar-logo .logo-link {
            display: none;
        }

        /* sidebar search */
        .home-layout .sidebar .sidebar-search {
            width: 100%;
            background-image: url(../icons/search-icon-black.svg);
            background-repeat: no-repeat;
            background-color: #8ed7c6;
            background-position: center;
            margin: 0 auto;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.2rem;
        }

        .home-layout .sidebar .sidebar-search::placeholder {
            visibility: hidden;
            opacity: 0;
        }

        /* sidebar menulist */
        .home-layout .sidebar .menu-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }

        .home-layout .sidebar .menu-list .menu-item {
            width: 100%;
        }

        .home-layout .sidebar .menu-list .menu-item .menu-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            transition: 0.2s ease-in-out;
        }

        .home-layout .sidebar .menu-list .menu-item .menu-link svg {
            flex-shrink: 0;
        }

        .home-layout .sidebar .menu-list .menu-item .menu-link .menu-link-txt {
            display: none;
            color: inherit;
        }

        .home-layout .sidebar .menu-list .menu-item .menu-link:hover {
            color: lightgrey;
        }

        /* sidebar user container */
        .home-layout .sidebar .user-container {
            background-color: #8ed7c6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
        }

        .home-layout .sidebar .user-container .user-info {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            display: none;
        }

        .home-layout .sidebar .user-container .user-info .user-details .user-name {
            font-size: 1.1rem;
            font-weight: lighter;
        }

        .home-layout .sidebar .user-container .user-info .user-details .user-ocupation {
            font-size: 0.9rem;
            font-weight: lighter;
        }

        /* sidebar functionality classes */
        .sidebar.active {
            width: 20%;
            max-width: 30%;
        }

        .sidebar.active .sidebar-container .sidebar-logo {
            justify-content: space-between;
            padding-left: 1rem;
        }

        .sidebar.active .sidebar-container .sidebar-logo .logo-link {
            display: block;
        }

        .sidebar.active .sidebar-search {
            background-position: 1rem 0.7rem;
            padding: 1rem;
            padding-left: 3rem;
        }

        .sidebar.active .sidebar-search::placeholder {
            visibility: visible;
            opacity: 1;
        }

        .sidebar.active .menu-list {
            padding-left: 1rem;
        }

        .sidebar.active .menu-list .menu-item .menu-link {
            justify-content: flex-start;
        }

        .sidebar.active .menu-list .menu-item .menu-link .menu-link-txt {
            display: inline;
        }

        .sidebar.active .user-container {
            justify-content: space-between;
            align-items: center;
        }

        .sidebar.active .user-container .user-info {
            display: flex;
        }

        .sidebar.active+.home-content {
            margin-left: 20%;
        }

        /* Home */
        .home-layout .home-content {
            flex: 1;
            width: auto;
            height: auto;
            margin-left: 4rem;
            transition: margin-left 0.3s ease-in-out;
            /* width: 70%; */
        }

        /* Media Query */
        @media screen and (max-width: 992px) {
            .home-layout .sidebar.active {
                min-width: 100%;
            }
        }
    </style>
</head>

    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const SidebarToggler = document.querySelector(".hamburger");
            const inputSearch = document.querySelector(".sidebar-search");
            const sidebar = document.querySelector(".sidebar");

            SidebarToggler.addEventListener("click", () => {
                sidebar.classList.toggle("active")
            })

            inputSearch.addEventListener("click", () => {
                if (!sidebar.classList.contains("active")) {
                    sidebar.classList.add('active');
                }
            })
            // Outside Click close:
            document.addEventListener("click", (event) => {
                if (!SidebarToggler.contains(event.target) && !inputSearch.contains(event.target)) {
                    sidebar.classList.remove("active");
                }
            })
        })
    </script>
</body>

</html>
